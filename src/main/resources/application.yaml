spring:
  application:
    name: caching-lab

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13307}/caching_lab
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 16379
      timeout: 2s

server:
  port: 8080
